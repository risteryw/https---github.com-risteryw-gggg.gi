<!DOCTYPE html>
<html lang="ru">
<head>
    <title>OZON</title>

    <style>
        body {
            margin: 0;
            background-color:thistle;
        }

        header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background-color: palevioletred;
            border-radius: 0 0 25px 25px;
        }
        .logo{
            font-size: 35px;
            font-weight: bold;
            color: black;
        }
        .cart{
            background-color: aliceblue;
            color:black;
            padding: 12px 25px;
            border-radius: 20px;  
        }
        main {
            width: 95%;
            margin: 30px auto;
        }
        .banner{
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 25px;
            display: block;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 12px;
            width: 100%;
            margin-top: 70px;
        }
        .product {
            width: 100%;
            background-color: aliceblue;
            border-radius: 15px;
            padding: 10px;

        }
        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }
        .price{
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .name{
            font-size: 13px;
            margin-top: 7px;
            
        }

    </style>
    <header>
        <div class="logo">OZON</div>
        <a href="#" class="cart">Корзина</a>
    </header>
    <main>
        <img src="banner.png" class="banner">

        <div class="product">
            <img src="1.png">

            <div class="price">6666₽</div>
            <div class="name">Ноутпук</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        
        <div class="product">
            <img src="2.png">

            <div class="price">333₽</div>
            <div class="name">Диффуузер</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="3.png">

            <div class="price">222₽</div>
            <div class="name">Подстопка</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="4.png">

            <div class="price">111₽</div>
            <div class="name">Пипипустер</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="5.png">

            <div class="price">444₽</div>
            <div class="name">Помётка</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
    </main>
