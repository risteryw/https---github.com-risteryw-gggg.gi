<!DOCTYPE html>
<html lang="ru">
<head>
    <title>OZON</title>

    <style>
        body {
            margin: 0;
            background-color:thistle;
        }

        header {
            background-color: palevioletred;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-radius: 0 0 25px 25px;
        }
        .logo{
            font-size: 35px;
            font-weight: bold;
            color: black;
        }
        .cart{
            background-color: aliceblue;
            color:black;
            padding: 15px 25px;
            border-radius: 20px;  
        }
        main {
            max-width: 1200px;
            margin: 30px auto;
        }
        .banner{
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 25px;
        }
        .products{
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 15px;
            margin-top: 80px;
        }
        .product {
            background-color: aliceblue;
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
        }
        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .price{
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .name{
            font-size: 14px;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .buy{
            display: block;
            text-align: center;
            background-color: hotpink;
            color:aliceblue;
            padding: 10px;
            border-radius: 10px;

        }
        .buy:hover{
            background-color: beige;
        }

    </style>
    <header>
        <div class="logo">OZON</div>
        <a href="#" class="cart">Корзина</a>
    </header>
    <main>
        <img src="banner.png" class="banner">

        <div class="product">
            <img src="1.png">

            <div class="price">6666₽</div>
            <div class="name">Ноутпук</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        
        <div class="product">
            <img src="2.png">

            <div class="price">333₽</div>
            <div class="name">Диффуузер</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="3.png">

            <div class="price">222₽</div>
            <div class="name">Подстопка</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="4.png">

            <div class="price">111₽</div>
            <div class="name">Пипипустер</div>
            <a href="#" class="buy">Купиtь</a>
        </div>
        <div class="product">
            <img src="5.png">

            <div class="price">444₽</div>
            <div class="name">Помётка</div>
            <a href="#" class="buy">Купиtь</a>
        </div>

</head>
<body>
    
</body>
</html>
